name: Rename placeholder whats-new visibility callback with actual pr number

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'classes/Feature/WhatsNew/Visibility/PR0Callback.php'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rename PR0Callback.php, update class name and add docblock
        if: hashFiles('classes/Feature/WhatsNew/Visibility/PR0Callback.php') != ''
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          PR_URL=${{ github.event.pull_request.html_url }}
          OLD_PATH="classes/Feature/WhatsNew/Visibility/PR0Callback.php"
          NEW_PATH="classes/Feature/WhatsNew/Visibility/PR${PR_NUMBER}Callback.php"
          
          echo "Adding @see docblock to ${OLD_PATH}"
          
          # Check if a docblock already exists above the class definition
          # We check if the line before the class PR0Callback is " */" or similar
          # This is a bit tricky with sed, using a simple check and different sed commands
          if grep -qPz "\*/\s*\n(final\s+)?(readonly\s+)?class PR0Callback" "${OLD_PATH}"; then
            echo "Existing docblock found. Appending @see to it."
            # Insert before the closing */ of the docblock that's immediately before the class
            # This uses a perl-style regex to find the */ that precedes the class definition
            perl -i -0777 -pe "s/(\s*\*\/)(\s+(final\s+)?(readonly\s+)?class PR0Callback)/\n * \@see ${PR_URL}\n\$1\$2/s" "${OLD_PATH}"
          else
            echo "No existing docblock found. Creating a new one."
            sed -i "/\(final\s\+\)\?\(readonly\s\+\)\?class PR0Callback/i \/** @see ${PR_URL} *\/" "${OLD_PATH}"
          fi

          echo "Replacing PR0Callback with PR${PR_NUMBER}Callback in ${OLD_PATH}"
          sed -i "s/class PR0Callback/class PR${PR_NUMBER}Callback/g" "${OLD_PATH}"
          
          echo "Moving ${OLD_PATH} to ${NEW_PATH}"
          mv "${OLD_PATH}" "${NEW_PATH}"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-rename visibility callback PR0Callback to PR${{ github.event.pull_request.number }}Callback"
          file_pattern: 'classes/Feature/WhatsNew/Visibility/*.php'
